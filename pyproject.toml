[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-lab"
version = "0.1.0"
description = "Local basketball shot analysis and review PoC"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "python-multipart>=0.0.20,<1",
  "numpy>=1.26,<3", "opencv-contrib-python==5.0.0.93", "av>=14,<17", "pillow>=11,<13"
]

[project.optional-dependencies]
vision = ["mediapipe==0.10.35", "rfdetr==1.10.1"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
basket = "basket.cli:main"

[tool.setuptools.packages.find]
include = ["basket*"]

[tool.setuptools.package-data]
basket = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
